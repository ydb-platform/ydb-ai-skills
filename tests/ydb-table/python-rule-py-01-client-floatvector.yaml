description: Python audit · client FloatVector list converted in YQL (RULE-PY-01)

vars:
  user_prompt: |
    Review this YDB Python query path. The embedding is produced by the application:

    ```python
    query = '''
    DECLARE $embedding AS List<Float>;
    SELECT id FROM documents
    ORDER BY Knn::CosineDistance(
        embedding, Knn::ToBinaryStringFloat($embedding))
    LIMIT 10;
    '''
    rows = pool.execute_with_retries(query, {
        "$embedding": (embedding, ydb.ListType(ydb.PrimitiveType.Float)),
    })
    ```

assert:
  - type: llm-rubric
    metric: table-python-audit
    threshold: 0.8
    value: |
      The response should:
      - Cite `RULE-PY-01` by ID.
      - Identify the client-provided `List<Float>` plus `Knn::ToBinaryStringFloat` conversion in YQL as the anti-pattern.
      - Link to the current YDB vector-search recipe and its Python tab for client-side serialization instead of inventing a serialization snippet.
      - Bind the serialized result as YQL `String` and use the parameter directly in `Knn::CosineDistance`.
      - Explain that the YQL conversion remains valid for a vector constructed within YQL.
  - type: contains
    metric: exact-rule-id
    value: RULE-PY-01
