description: Query parameters · Optional DECLARE and unquoted type syntax

vars:
  user_prompt: |
    We run YDB 25.1.2.7 with Syntax V1 and send `$id` as a typed SDK parameter. Is this
    declaration still required, and is its syntax correct?

    ```yql
    DECLARE $id AS "Uint64";

    SELECT value FROM items WHERE id = $id;
    ```

    Show the corrected query and explain when keeping `DECLARE` is useful.

assert:
  - type: llm-rubric
    metric: table-query
    threshold: 0.8
    value: |
      The response should:
      - State that Syntax V1 on YDB 25.1.2.7+ can take parameter types
        from typed values sent with the same request, so `DECLARE` is
        optional in this case. Do not claim the type comes from SQL context.
      - Identify the quoted type as invalid under Syntax V1. If the
        declaration is kept, correct it to exactly `DECLARE $id AS Uint64;`
        (without quotes). Omitting the declaration entirely is also a valid
        corrected query.
      - Keep `$id` as a separately bound parameter. `DECLARE` only describes
        its type and does not provide the value or make interpolation safe.
      - Explain that an explicit declaration remains useful as a caller
        contract, for readability of compound types, or for compatibility
        with YDB servers older than 25.1.2.7. At least one
        contract/readability reason and the older-server compatibility
        reason should be present.
      - Avoid calling `DECLARE` itself an anti-pattern or deprecated syntax.

      Full fail if the response requires `DECLARE` for this typed Syntax V1
      request on YDB 25.1.2.7,
      preserves quotes around `Uint64`, or replaces typed binding with value
      interpolation in the query text.
