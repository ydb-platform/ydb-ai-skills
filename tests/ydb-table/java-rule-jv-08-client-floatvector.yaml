description: Java audit · client FloatVector list converted in YQL (RULE-JV-08)

vars:
  user_prompt: |
    Review this YDB Java query path. The application already has the embedding
    as `float[]`, binds it as a YQL `List<Float>` parameter, and runs:

    ```yql
    DECLARE $embedding AS List<Float>;
    SELECT id FROM documents
    ORDER BY Knn::CosineDistance(
        embedding, Knn::ToBinaryStringFloat($embedding))
    LIMIT 10;
    ```

assert:
  - type: llm-rubric
    metric: table-java-audit
    threshold: 0.8
    value: |
      The response should:
      - Cite `RULE-JV-08` by ID.
      - Identify the application-provided `float[]` bound as `List<Float>` plus server-side `Knn::ToBinaryStringFloat` as the anti-pattern.
      - Link to the current YDB vector-search recipe and its Java tab for client-side serialization instead of inventing a serialization snippet.
      - Bind the serialized result as YQL `String` and use it directly in `Knn::CosineDistance`.
      - Explain that the YQL conversion remains valid for a vector constructed within YQL.
  - type: contains
    metric: exact-rule-id
    value: RULE-JV-08
