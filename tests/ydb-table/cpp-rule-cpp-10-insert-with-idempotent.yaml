description: C++ audit · INSERT INTO inside .Idempotent(true) retry (RULE-CPP-10)

vars:
  user_prompt: |
    Review this C++ event-recording function. During cluster upgrades
    we get sporadic errors here even when the event row turns out to
    already be in the table. Is the SDK call correct?

    ```cpp
    TStatus recordEvent(NYdb::NQuery::TQueryClient& client, uint64_t eventId,
                        const std::string& payload) {
        return client.RetryQuerySync(
            [eventId, payload](NYdb::NQuery::TSession session) {
                auto params = NYdb::TParamsBuilder()
                    .AddParam("$id").Uint64(eventId).Build()
                    .AddParam("$payload").Utf8(payload).Build()
                    .Build();
                return session.ExecuteQuery(
                    R"(INSERT INTO events (id, payload) VALUES ($id, $payload))",
                    NYdb::NQuery::TTxControl::BeginTx(
                        NYdb::NQuery::TTxSettings::SerializableRW()).CommitTx(),
                    params
                ).GetValueSync();
            },
            NYdb::NRetry::TRetryOperationSettings().Idempotent(true));
    }
    ```

assert:
  - type: llm-rubric
    metric: table-cpp-audit
    threshold: 0.8
    value: |
      The response should:
      - Cite `RULE-CPP-10` by ID.
      - Identify the combination of `INSERT INTO` plus
        `.Idempotent(true)` on `RetryQuerySync` as the antipattern.
      - Explain that `INSERT` is not idempotent under retry: a
        replay after `UNDETERMINED` / `TRANSPORT_UNAVAILABLE` (which
        the idempotent flag unlocks) hits `PRECONDITION_FAILED`
        (`insert_pk` constraint violation) when the first attempt
        actually committed, surfacing a hard failure for a write
        that did land.
      - Recommend one of: switch to `UPSERT INTO` (replay-safe by
        construction), drop `.Idempotent(true)` and accept the
        propagated `UNDETERMINED`, or add a server-side idempotency
        guard (dedup table / existence check) before opting back in.
      - Not invent a different RULE-CPP-XX ID. May also mention
        RULE-CPP-03 if discussing the wider idempotency story, but
        the primary citation should be CPP-10.

      Full fail if the response endorses `INSERT INTO` with
      `.Idempotent(true)` as a safe pattern.
  - type: contains
    metric: exact-rule-id
    value: RULE-CPP-10
