description: Java audit · detached SessionRetryContext and reset query timeout (RULE-JV-07)

vars:
  user_prompt: |
    Review this native YDB Java SDK helper. `callerDeadline` is the absolute
    deadline of the incoming request, and `requestCancelled` completes when
    the caller disconnects.

    ```java
    CompletableFuture<Result<QueryInfo>> loadUsers(
            QueryClient client,
            Instant callerDeadline,
            CompletableFuture<Void> requestCancelled) {
        SessionRetryContext retryContext = SessionRetryContext.create(client)
                .maxRetries(10)
                .idempotent(true)
                .build();

        return retryContext.supplyResult(session -> session.createQuery(
                "SELECT id, name FROM users",
                TxMode.SNAPSHOT_RO,
                Params.empty(),
                ExecuteQuerySettings.newBuilder()
                        .withRequestTimeout(Duration.ofSeconds(30))
                        .build())
                .execute(this::onPart));
    }
    ```

assert:
  - type: llm-rubric
    metric: table-java-audit
    threshold: 0.8
    value: |
      The response should:
      - Cite `RULE-JV-07` by ID.
      - Identify both missing propagation paths: the future returned by
        `SessionRetryContext.supplyResult(...)` is not retained and cancelled
        when `requestCancelled` completes, and every retry receives a fresh
        fixed 30-second `withRequestTimeout` instead of the remaining duration
        until `callerDeadline`.
      - Recommend retaining the outer retry future and registering caller
        cancellation with `operation.cancel(false)`.
      - Recommend recomputing the remaining duration from the original
        `callerDeadline` inside the retry callback and passing it to
        `.withRequestTimeout(...)` for the current `ExecuteQuery` attempt.
      - State the boundary precisely: cancelling the SessionRetryContext
        future prevents subsequent retries but does not cancel an already
        running ExecuteQuery; its request timeout bounds that attempt.
      - State that cancelling the inner ExecuteQuery future is normally
        unnecessary and is not a substitute for cancelling the outer retry
        future.

      Full fail if the response recommends cancelling only the inner query
      future or claims that cancelling the SessionRetryContext future aborts
      an already running ExecuteQuery.
  - type: contains
    metric: exact-rule-id
    value: RULE-JV-07
