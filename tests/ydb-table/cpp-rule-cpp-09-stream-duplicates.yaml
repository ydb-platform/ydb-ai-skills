description: C++ audit · StreamExecuteQuery without duplicate handling (RULE-CPP-09)

vars:
  user_prompt: |
    Review this C++ export job. It streams seasons for billing. We
    occasionally double-charge after network blips. Is the stream
    handling correct?

    ```cpp
    void billSeasons(NYdb::NQuery::TQueryClient& client) {
        ThrowOnError(client.RetryQuerySync([&](NYdb::NQuery::TSession session) -> TStatus {
            auto stream = session.StreamExecuteQuery(
                "SELECT series_id, season_id FROM seasons",
                TTxControl::NoTx()
            ).GetValueSync();
            if (!stream.IsSuccess()) {
                return stream;
            }
            bool eos = false;
            while (!eos) {
                auto part = stream.ReadNext().ExtractValueSync();
                if (!part.IsSuccess()) {
                    eos = true;
                    if (!part.EOS()) {
                        return part;
                    }
                    continue;
                }
                if (part.HasResultSet()) {
                    TResultSetParser parser(part.ExtractResultSet());
                    while (parser.TryNextRow()) {
                        auto seriesId = *parser.ColumnParser("series_id")
                            .GetOptionalUint64();
                        auto seasonId = *parser.ColumnParser("season_id")
                            .GetOptionalUint64();
                        chargeCustomer(seriesId, seasonId);
                    }
                }
            }
            return TStatus(EStatus::SUCCESS, NYdb::NIssue::TIssues());
        }));
    }
    ```

assert:
  - type: llm-rubric
    metric: table-cpp-audit
    threshold: 0.8
    value: |
      The response should:
      - Cite `RULE-CPP-09` by ID.
      - Explain that `StreamExecuteQuery` inside a retrier can emit
        duplicate rows on replay (per YDB docs — stream queries /
        retry recipe).
      - Connect this to double-charging via `chargeCustomer` with no
        dedupe / idempotent sink.
      - Recommend idempotent billing (keyed UPSERT, dedup table) or
        cursor-based skip of already-seen keys.
      - Not invent a different RULE-CPP-XX ID.

      Full fail if the response blames only application logic outside
      the stream without mentioning retry-induced duplicates.
  - type: contains
    metric: exact-rule-id
    value: RULE-CPP-09
