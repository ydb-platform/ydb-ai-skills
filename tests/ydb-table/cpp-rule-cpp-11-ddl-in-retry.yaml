description: C++ audit · DDL (ExecuteSchemeQuery) inside RetryOperationSync lambda (RULE-CPP-11)

vars:
  user_prompt: |
    Review this C++ helper. We use it to make sure a per-tenant
    events table exists before writing the first row. It runs on the
    hot write path. Is the YDB usage correct?

    ```cpp
    TStatus ensureTenantTableAndInsert(NYdb::NTable::TTableClient& client,
                                       const std::string& tablePath,
                                       uint64_t eventId,
                                       const std::string& payload) {
        return client.RetryOperationSync(
            [&](NYdb::NTable::TSession session) -> NYdb::TStatus {
                auto createStatus = session.ExecuteSchemeQuery(
                    "CREATE TABLE IF NOT EXISTS `" + tablePath + "` ("
                    "  id Uint64,"
                    "  payload Utf8,"
                    "  PRIMARY KEY (id))"
                ).GetValueSync();
                if (!createStatus.IsSuccess()) {
                    return createStatus;
                }

                auto params = NYdb::TParamsBuilder()
                    .AddParam("$id").Uint64(eventId).Build()
                    .AddParam("$payload").Utf8(payload).Build()
                    .Build();
                return session.ExecuteDataQuery(
                    "UPSERT INTO `" + tablePath + "` (id, payload) "
                    "VALUES ($id, $payload)",
                    NYdb::NTable::TTxControl::BeginTx(
                        NYdb::NTable::TTxSettings::SerializableRW()).CommitTx(),
                    params
                ).GetValueSync();
            },
            NYdb::NTable::TRetryOperationSettings().Idempotent(true));
    }
    ```

assert:
  - type: llm-rubric
    metric: table-cpp-audit
    threshold: 0.8
    value: |
      The response should:
      - Cite `RULE-CPP-11` by ID.
      - Identify that DDL (`session.ExecuteSchemeQuery` with a
        `CREATE TABLE` payload) sits inside the `RetryOperationSync`
        lambda alongside DML, so the SDK's query retry classifier
        governs schema operations it was not designed for.
      - Explain the failure mode: a retried DDL after `BAD_SESSION`
        / `UNAVAILABLE` can land twice, an `ALTER`/`CREATE` can be
        partially applied, and DML retry semantics do not translate
        to schema mutations.
      - Recommend moving table creation to dedicated startup /
        migration code (run once, outside the SDK retrier) and
        keeping the `RetryOperationSync` lambda DML-only.
      - Not invent a different RULE-CPP-XX ID.

      Full fail if the response says co-locating DDL with DML inside
      `RetryOperationSync` is a fine on-demand pattern.
  - type: contains
    metric: exact-rule-id
    value: RULE-CPP-11
