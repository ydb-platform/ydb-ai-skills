description: C++ audit · TDriver constructed per request instead of once per process (RULE-CPP-06)

vars:
  user_prompt: |
    Review this C++ HTTP handler. Latency feels high under load even
    for tiny queries. Is the YDB setup right?

    ```cpp
    void handleGetUser(const HttpRequest& req, HttpResponse& res) {
        auto cfg = NYdb::TDriverConfig()
            .SetEndpoint("grpcs://ydb.example.net:2135")
            .SetDatabase("/prod/users")
            .SetAuthToken(std::getenv("YDB_TOKEN"));
        NYdb::TDriver driver(cfg);
        NYdb::NQuery::TQueryClient client(driver);

        auto queryResult = client.RetryQuerySync([&](NYdb::NQuery::TSession session) {
            auto params = NYdb::TParamsBuilder()
                .AddParam("$id").Uint64(req.userId).Build()
                .Build();
            return session.ExecuteQuery(
                "SELECT name FROM users WHERE id = $id",
                NYdb::NQuery::TTxControl::BeginTx(
                    NYdb::NQuery::TTxSettings::SnapshotRO()).CommitTx(),
                params
            ).GetValueSync();
        });
        ThrowOnError(queryResult);
        writeUserToResponse(queryResult, res);

        driver.Stop(true);
    }
    ```

assert:
  - type: llm-rubric
    metric: table-cpp-audit
    threshold: 0.8
    value: |
      The response should:
      - Cite `RULE-CPP-06` by ID.
      - Identify that `NYdb::TDriver` is constructed inside the
        per-request handler rather than once at process startup.
      - Explain the cost: endpoint discovery, gRPC channel setup, and
        TLS handshake on every request, with corresponding latency
        and connection churn at the cluster.
      - Recommend holding one long-lived `TDriver` for the process
        and passing it to per-request `TQueryClient` construction,
        with `driver.Stop(true)` at shutdown (not per request).
      - Not invent a different RULE-CPP-XX ID.

      Full fail if the response says per-request driver construction
      is fine or recommends only tuning timeouts without addressing
      the driver lifecycle.
  - type: contains
    metric: exact-rule-id
    value: RULE-CPP-06
