description: C++ audit · Explicit BeginTransaction when fused TTxControl suffices (RULE-CPP-08)

vars:
  user_prompt: |
    Review this single-statement C++ update. Latency seems high — extra
    round trips?

    ```cpp
    TStatus markProcessed(NYdb::NQuery::TQueryClient& client, uint64_t id) {
        return client.RetryQuerySync([id](NYdb::NQuery::TSession session) -> TStatus {
            auto begin = session.BeginTransaction(TTxSettings::SerializableRW())
                .GetValueSync();
            if (!begin.IsSuccess()) {
                return begin;
            }
            auto tx = begin.GetTransaction();
            auto params = TParamsBuilder()
                .AddParam("$id").Uint64(id).Build().Build();
            auto result = session.ExecuteQuery(
                "UPDATE logs SET processed = true WHERE id = $id",
                TTxControl::Tx(tx),
                params
            ).GetValueSync();
            if (!result.IsSuccess()) {
                return result;
            }
            return tx.Commit().GetValueSync();
        });
    }
    ```

assert:
  - type: llm-rubric
    metric: table-cpp-audit
    threshold: 0.8
    value: |
      The response should:
      - Cite `RULE-CPP-08` by ID.
      - Identify separate `BeginTransaction` + `Commit` for a single
        `ExecuteQuery` where `TTxControl::BeginTx(...).CommitTx()`
        would fuse round trips.
      - Reference YDB C++ example app docs (Managing transactions)
        that fused transaction control on `ExecuteQuery` is preferable
        for most single-statement work.
      - Not flag multi-step `MultiStep`-style flows (this snippet is
        single-statement).
      - Not invent a different RULE-CPP-XX ID.

      Full fail if the response says explicit begin/commit is always
      required.
  - type: contains
    metric: exact-rule-id
    value: RULE-CPP-08
