description: Go audit · Reading all matching rows through Table Service (RULE-GO-01)

vars:
  user_prompt: |
    Review this Go function that runs in our billing pipeline once a day.
    It reads all unbilled usage items and charges the customer for each.
    Tell me if anything is wrong.

    ```go
    func loadUnbilled(ctx context.Context, db *ydb.Driver) ([]UsageItem, error) {
        var items []UsageItem
        err := db.Table().Do(ctx, func(ctx context.Context, s table.Session) error {
            local := make([]UsageItem, 0, 1000)
            _, res, err := s.Execute(ctx, table.DefaultTxControl(),
                `SELECT user_id, amount FROM usage_items WHERE billed = false`, nil)
            if err != nil {
                return err
            }
            defer res.Close()
            for res.NextResultSet(ctx) {
                for res.NextRow() {
                    var item UsageItem
                    if err := res.ScanWithDefaults(&item.UserID, &item.Amount); err != nil {
                        return err
                    }
                    local = append(local, item)
                }
            }
            if err := res.Err(); err != nil {
                return err
            }
            items = local
            return nil
        }, table.WithIdempotent())
        return items, err
    }

    // caller later does:
    //   items, err := loadUnbilled(ctx, db)
    //   for _, it := range items { chargeCustomer(ctx, it.UserID, it.Amount) }
    ```

assert:
  - type: llm-rubric
    metric: table-go-audit
    threshold: 0.8
    value: |
      The response should:
      - Cite `RULE-GO-01` by ID (Table Service read without pagination).
      - State that Table Service `s.Execute` caps query results at 1000
        rows by default, and characterise the v3 behaviour correctly: a
        truncated result surfaces as a non-retryable error. It is
        acceptable to also note that passing `ydb.WithIgnoreTruncated` to
        the driver restores v2-style silent truncation where the call
        returns `err == nil` with the excess rows dropped. (Scan queries
        via `s.StreamExecuteScanQuery` are the streaming path for large
        result sets and are not the target of this rule.)
      - Explain the consequence specifically in the billing context: the
        function works in dev with a small data set, but in production once
        the match exceeds 1000 it either errors out and stops billing or —
        if `WithIgnoreTruncated` is set — silently under-charges. The bug
        is data-dependent and not catchable by tests on a small dev
        dataset.
      - Recommend redesigning the read to exhaust the result set —
        keyset pagination over the table's primary key, wrapped in an
        outer loop that terminates when a page comes back empty, or
        the Query Service streaming path. The fix is structural, not
        a knob.
      - Not invent a different RULE-GO-XX ID that isn't in the loaded rules
        file.

      Full fail if the response:
      - Only suggests adding an explicit `LIMIT` clause without an outer
        pagination loop.
      - Recommends `ydb.WithIgnoreTruncated` or "raising the cap" as a fix.
      - Treats the issue as performance / memory rather than as a
        correctness bug.
      - Defends the code as correct on the grounds that "Table Service
        works fine for SELECT queries".
  - type: contains
    metric: exact-rule-id
    value: RULE-GO-01
