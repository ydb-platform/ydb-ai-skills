description: Table CLI · Encode typed YDB parameters in JSON

vars:
  user_prompt: |
    Using profile `prod`, show me the exact `ydb sql` command and a
    `params.json` file for `query.sql`. Do not execute it. The query declares
    `$id AS Uint64`, `$at AS Timestamp`, `$price AS Decimal(22,9)`,
    `$metadata AS JsonDocument`, `$tags AS List<Utf8>`, and
    `$deleted_at AS Timestamp?`. Use id 42, timestamp
    2026-08-28T12:34:56.123456Z, price 123.45, metadata
    {"source":"cli"}, tags blue and green, and a null deleted_at.

assert:
  - type: llm-rubric
    metric: table-cli
    threshold: 0.8
    value: |
      The response should:
      - Verify the installed `ydb sql` parameter interface with `-hh` before
        relying on advanced input options.
      - For a non-TTY agent subprocess, use `ydb -p prod sql -f query.sql
        --input-file - --input-format json < params.json`, with global
        connection options before `sql`.
      - Encode id as JSON number 42, timestamp as an ISO-8601 JSON string,
        Decimal as a JSON string compatible with Decimal(22,9), tags as a JSON
        array, and deleted_at as JSON null.
      - Encode the JsonDocument value as a JSON string containing serialized
        JSON, not as an unquoted nested object.
      - Use parameter-file keys without `$` and not interpolate values into SQL.
      - Not execute the query or add `-y`.
