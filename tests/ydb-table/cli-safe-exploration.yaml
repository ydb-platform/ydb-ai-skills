description: Table CLI · Inspect schema and values before filtering

vars:
  user_prompt: |
    Using profile `prod`, find the latest 20 paid orders in
    `/Root/app/orders` with `ydb sql`. I do not know the table schema or the
    exact stored status values. Run whatever reads you need.

assert:
  - type: llm-rubric
    metric: table-cli
    threshold: 0.8
    value: |
      The response should:
      - Verify the installed CLI and relevant command help before composing
        database commands.
      - Inspect `/Root/app/orders` with `ydb scheme describe` before naming
        columns, types, or primary keys.
      - Avoid assuming the stored status is `paid` or `PAID`; after learning
        the real column name, constrain discovery through a suitable key range
        or index when one is available.
      - Inspect the plan before a distinct-values query that may scan the full
        table, and warn or obtain approval before a potentially large scan.
      - Use a small `LIMIT` to bound returned rows, without claiming that it
        bounds scan volume or server work.
      - Parameterize the final status value with `DECLARE` plus `--param`
        rather than interpolating it into SQL text.
      - Keep `-p prod` before each subcommand and add no other connection
        target or `--assume-yes` option.
