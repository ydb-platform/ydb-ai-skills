description: C++ audit · Non-parametrized YQL via std::format (RULE-CPP-07)

vars:
  user_prompt: |
    Review this C++ lookup. User ids come from an HTTP request.

    ```cpp
    TStatus fetchUser(NYdb::NQuery::TQueryClient& client, uint64_t userId) {
        auto sql = std::format("SELECT name FROM users WHERE id = {}", userId);
        return client.RetryQuerySync([&sql](TSession session) {
            return session.ExecuteQuery(
                sql,
                TTxControl::BeginTx(TTxSettings::SnapshotRO()).CommitTx()
            ).GetValueSync();
        }, NYdb::NRetry::TRetryOperationSettings().Idempotent(true));
    }
    ```

assert:
  - type: llm-rubric
    metric: table-cpp-audit
    threshold: 0.8
    value: |
      The response should:
      - Cite `RULE-CPP-07` by ID.
      - Identify `std::format` embedding `userId` into query text
        instead of `TParamsBuilder` binding.
      - Explain injection risk and plan-cache churn from distinct
        query strings.
      - Show or describe binding via `TParamsBuilder` and a
        parameterized query with `$id`.
      - Not invent a different RULE-CPP-XX ID.

      Full fail if the response says formatting a numeric id is safe
      enough to skip parameterization.
  - type: contains
    metric: exact-rule-id
    value: RULE-CPP-07
