description: C++ audit · Missing Idempotent on RetryQuerySync (RULE-CPP-03)

vars:
  user_prompt: |
    Review this C++ function. It UPSERTs an event keyed by client-side
    `eventId`. During cluster upgrades we see sporadic errors, but the
    row is already in the table when we check. Is the SDK call correct?

    ```cpp
    TStatus recordEvent(NYdb::NQuery::TQueryClient& client, uint64_t eventId,
                        const std::string& payload) {
        return client.RetryQuerySync([eventId, payload](TSession session) {
            auto params = TParamsBuilder()
                .AddParam("$id").Uint64(eventId).Build()
                .AddParam("$payload").Utf8(payload).Build()
                .Build();
            return session.ExecuteQuery(
                R"(UPSERT INTO events (id, payload) VALUES ($id, $payload))",
                TTxControl::BeginTx(TTxSettings::SerializableRW()).CommitTx(),
                params
            ).GetValueSync();
        });
    }
    ```

assert:
  - type: llm-rubric
    metric: table-cpp-audit
    threshold: 0.8
    value: |
      The response should:
      - Cite `RULE-CPP-03` by ID.
      - Identify missing `TRetryOperationSettings().Idempotent(true)`
        on `RetryQuerySync`.
      - Explain that `UNDETERMINED` / `TRANSPORT_UNAVAILABLE` are only
        retried when idempotent is set, matching the user's symptom of
        committed writes after client-side failure.
      - Recommend adding `.Idempotent(true)` because the UPSERT is
        keyed on a client-generated id.
      - Not invent a different RULE-CPP-XX ID.

      Full fail if the response says the code is fine or recommends an
      outer manual retry loop instead of the idempotent flag.
  - type: contains
    metric: exact-rule-id
    value: RULE-CPP-03
