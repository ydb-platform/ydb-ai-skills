description: Go audit · detached caller context loses deadline and cancellation (RULE-GO-12)

vars:
  user_prompt: |
    Review this request handler. The incoming context is cancelled when the
    HTTP client disconnects and may already carry a deadline.

    ```go
    func loadUser(requestCtx context.Context, db *ydb.Driver, id uint64) error {
        queryCtx, cancel := context.WithTimeout(context.Background(), 30*time.Second)
        defer cancel()

        return db.Query().Do(queryCtx, func(attemptCtx context.Context, s query.Session) error {
            res, err := s.Query(queryCtx,
                `SELECT name FROM users WHERE id = $id`,
                query.WithParameters(ydb.ParamsBuilder().
                    Param("$id").Uint64(id).Build()),
            )
            if err != nil { return err }
            return res.Close(queryCtx)
        }, query.WithIdempotent())
    }
    ```

assert:
  - type: llm-rubric
    metric: table-go-audit
    threshold: 0.8
    value: |
      The response should:
      - Cite `RULE-GO-12` by ID.
      - Identify `context.Background()` as detaching the YDB work from the
        incoming request's cancellation and deadline.
      - Explain that the one caller-derived context/budget must cover session
        acquisition, every retry attempt, the RPC, and result draining; a new
        fixed timeout per attempt must not reset that budget.
      - Recommend deriving the bounded context from `requestCtx`, deferring
        its cancel function, passing it to `db.Query().Do`, and using the
        callback's `attemptCtx` for `s.Query` and `res.Close`.
      - State that cancellation stops work best-effort and is not evidence
        that a write was rolled back; replay safety still depends on
        idempotency.

      Full fail if the response recommends `context.Background()` for the YDB
      call or creates a fresh full timeout inside every retry attempt.
  - type: contains
    metric: exact-rule-id
    value: RULE-GO-12
