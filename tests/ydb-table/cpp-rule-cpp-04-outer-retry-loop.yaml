description: C++ audit · Outer for loop around RetryQuerySync (RULE-CPP-04)

vars:
  user_prompt: |
    Review this C++ retry wrapper around a YDB update. We added it
    after seeing `ABORTED` under contention. Is this the right pattern?

    ```cpp
    TStatus updateBalance(NYdb::NQuery::TQueryClient& client, uint64_t userId,
                          int64_t delta) {
        TStatus status(EStatus::SUCCESS, NYdb::NIssue::TIssues());
        for (int attempt = 0; attempt < 5; ++attempt) {
            status = client.RetryQuerySync([userId, delta](TSession session) {
                auto params = TParamsBuilder()
                    .AddParam("$id").Uint64(userId).Build()
                    .AddParam("$delta").Int64(delta).Build()
                    .Build();
                return session.ExecuteQuery(
                    "UPDATE accounts SET balance = balance + $delta WHERE id = $id",
                    TTxControl::BeginTx(TTxSettings::SerializableRW()).CommitTx(),
                    params
                ).GetValueSync();
            });
            if (status.IsSuccess()) {
                break;
            }
        }
        return status;
    }
    ```

assert:
  - type: llm-rubric
    metric: table-cpp-audit
    threshold: 0.8
    value: |
      The response should:
      - Cite `RULE-CPP-04` by ID.
      - Explain that `RetryQuerySync` already retries internally and
        an outer `for` multiplies backoff / retry budget.
      - Recommend removing the outer loop and tuning
        `TRetryOperationSettings` instead.
      - Note the inner write is non-idempotent (`balance + $delta`) so
        `.Idempotent(true)` must not be set blindly — separate from
        but compatible with RULE-CPP-04.
      - Not invent a different RULE-CPP-XX ID.

      Full fail if the response endorses the outer loop as best practice.
  - type: contains
    metric: exact-rule-id
    value: RULE-CPP-04
