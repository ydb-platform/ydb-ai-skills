description: C++ audit · Unbounded Table read without pagination (RULE-CPP-01)

vars:
  user_prompt: |
    Review this C++ function. It should process every log row where
    `processed = false`. Works in dev, but in prod we only ever see
    the first chunk of rows. Is the YDB call correct?

    ```cpp
    void processPendingLogs(NYdb::NTable::TTableClient& client) {
        client.RetryOperationSync([&](NYdb::NTable::TSession session) {
            auto result = session.ExecuteDataQuery(
                "SELECT id, payload FROM logs WHERE processed = false",
                NYdb::NTable::TTxControl::BeginTx(
                    NYdb::NTable::TTxSettings::SerializableRW()).CommitTx()
            ).GetValueSync();
            if (!result.IsSuccess()) {
                return result;
            }
            TResultSetParser parser(result.GetResultSet(0));
            while (parser.TryNextRow()) {
                auto id = *parser.ColumnParser("id").GetOptionalUint64();
                handleLog(id);
            }
            return TStatus(EStatus::SUCCESS, NYdb::NIssue::TIssues());
        });
    }
    ```

assert:
  - type: llm-rubric
    metric: table-cpp-audit
    threshold: 0.8
    value: |
      The response should:
      - Cite `RULE-CPP-01` by ID.
      - Identify that `ExecuteDataQuery` with an unbounded range read
        and no `Truncated()` check, no keyset pagination, and no
        `StreamExecuteScanQuery` cannot exhaust the full match.
      - Recommend a structural fix: keyset pagination, Query Service
        streaming, or `StreamExecuteScanQuery`.
      - Not invent a different RULE-CPP-XX ID.

      Full fail if the response says the code is fine or blames only
      network latency without addressing result-set truncation.
  - type: contains
    metric: exact-rule-id
    value: RULE-CPP-01
