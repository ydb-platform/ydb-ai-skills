description: C++ audit · Custom Sleep retrier around YDB calls (RULE-CPP-05)

vars:
  user_prompt: |
    Review this C++ helper. We retry YDB ourselves with exponential
    backoff when the cluster is flaky. Any issues?

    ```cpp
    TStatus runQueryWithBackoff(NYdb::NQuery::TQueryClient& client,
                                const std::string& sql) {
        auto session = client.GetSession().GetValueSync().GetSession();
        TStatus status(EStatus::GENERIC_ERROR, NYdb::NIssue::TIssues());
        for (int i = 0; i < 10; ++i) {
            status = session.ExecuteQuery(
                sql,
                TTxControl::BeginTx(TTxSettings::SnapshotRO()).CommitTx()
            ).GetValueSync();
            if (status.IsSuccess()) {
                return status;
            }
            std::this_thread::sleep_for(std::chrono::milliseconds(50 * (1 << i)));
        }
        return status;
    }
    ```

assert:
  - type: llm-rubric
    metric: table-cpp-audit
    threshold: 0.8
    value: |
      The response should:
      - Cite `RULE-CPP-05` by ID.
      - Flag the hand-rolled `sleep_for` loop around bare
        `ExecuteQuery` instead of `RetryQuerySync`.
      - Explain that custom retriers miss SDK error classification
        and idempotency gating.
      - Recommend `RetryQuerySync` with `TRetryOperationSettings`.
      - Not invent a different RULE-CPP-XX ID.

      Full fail if the response says the custom backoff is fine.
  - type: contains
    metric: exact-rule-id
    value: RULE-CPP-05
