description: Query · Keyset pagination in YQL + Go

vars:
  user_prompt: |
    Write a YQL query and the Go code (using ydb-go-sdk/v3) to paginate
    a `users` table by `(created_at, id)` — where `created_at` is
    `Timestamp` and `id` is `Uint64`, 50 rows per page.

assert:
  - type: llm-rubric
    metric: table-keyset
    threshold: 0.8
    value: |
      The response should:
      - Use keyset pagination over the primary key with tuple comparison —
        `WHERE (created_at, id) > ($cursorCreatedAt, $cursorId)` (or
        equivalent compound predicate) and `ORDER BY created_at, id LIMIT $limit`.
        The field order in the tuple must match the primary key.
      - Avoid `OFFSET` for pagination. Citing `OFFSET` only to explain why
        it's the wrong shape is acceptable; recommending `OFFSET` as the
        pagination mechanism is a fail.
      - Bind cursor and limit through the SDK's typed parameter API
        (`ydb.ParamsBuilder()` with `.Param("$cursorCreatedAt").Timestamp(...)`,
        `.Param("$cursorId").Uint64(...)`, and `.Param("$limit").Uint64(...)` (set to 50)).
        Raw-string interpolation of values into the query text is a fail.
      - Wrap the per-page read in `db.Query().Do(ctx, func(ctx, s query.Session) error { ... })`
        and pass `query.WithIdempotent()` — the read is idempotent.
      - Show or describe the caller-side cursor loop that terminates when
        a page returns fewer than `$limit` rows.

      Partial credit if pagination shape is keyset but the Go wrapper is
      missing the retry-scope (`Do`) or `WithIdempotent`.

      Full fail if the response:
      - Uses `OFFSET` (e.g. `LIMIT $limit OFFSET $n`) as the pagination mechanism.
      - Interpolates the cursor or limit into the query string via
        `fmt.Sprintf` / string concatenation.
      - Puts the cursor field order in the tuple comparison in a different
        order than the primary key (e.g. `WHERE (id, created_at) > ...`
        when the PK is `(created_at, id)`).
