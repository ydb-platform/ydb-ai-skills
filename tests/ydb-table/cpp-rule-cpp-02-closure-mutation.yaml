description: C++ audit · External state mutation in retry lambda (RULE-CPP-02)

vars:
  user_prompt: |
    Review this C++ read helper. Under load we sometimes get duplicate
    rows in `out` after transient YDB errors. Is the retry usage correct?

    ```cpp
    std::vector<Row> loadUsers(NYdb::NQuery::TQueryClient& client) {
        std::vector<Row> out;
        ThrowOnError(client.RetryQuerySync([&out](NYdb::NQuery::TSession session) {
            auto result = session.ExecuteQuery(
                "SELECT id, name FROM users",
                TTxControl::BeginTx(TTxSettings::SnapshotRO()).CommitTx()
            ).GetValueSync();
            if (!result.IsSuccess()) {
                return result;
            }
            TResultSetParser parser(result.GetResultSet(0));
            while (parser.TryNextRow()) {
                out.push_back({
                    *parser.ColumnParser("id").GetOptionalUint64(),
                    *parser.ColumnParser("name").GetOptionalUtf8(),
                });
            }
            return result;
        }));
        return out;
    }
    ```

assert:
  - type: llm-rubric
    metric: table-cpp-audit
    threshold: 0.8
    value: |
      The response should:
      - Cite `RULE-CPP-02` by ID.
      - Explain that `push_back` on an outer vector inside
        `RetryQuerySync` survives across retry attempts and duplicates
        rows on replay.
      - Recommend building a local vector inside the lambda and
        assigning to `out` only on the success path.
      - Not invent a different RULE-CPP-XX ID.

      Full fail if the response says duplicates are expected YDB
      behavior without flagging the closure mutation pattern.
  - type: contains
    metric: exact-rule-id
    value: RULE-CPP-02
