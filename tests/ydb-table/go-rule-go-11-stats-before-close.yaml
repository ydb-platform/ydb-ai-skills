description: Go audit · Stats consumed before stream drain (RULE-GO-11)

vars:
  user_prompt: |
    We use YDB query stats for diagnostics and adaptive tuning.
    Sometimes the diagnostics are empty even when the query itself succeeds.
    Review this helper:

    ```go
    func runAndCollectStats(ctx context.Context, s query.Session) (summary StatsSummary, err error) {
        var stats query.Stats

        res, err := s.Query(ctx,
            `SELECT id, payload FROM events WHERE id > $from LIMIT 100`,
            query.WithStatsMode(query.StatsModeBasic, func(s query.Stats) {
                stats = s
            }),
        )
        if err != nil {
            return 0, err
        }
        defer func() { _ = res.Close(ctx) }()

        return summarizeStats(stats), nil
    }
    ```

assert:
  - type: llm-rubric
    metric: table-go-audit
    threshold: 0.8
    value: |
      The response should:
      - Cite `RULE-GO-11` by ID.
      - Explain that `ExecuteQuery` is a stream: `WithStatsMode` callbacks
        can fire on earlier parts while later parts may still contain
        additional/final stats data.
      - Explain that control can return to caller code before all stream
        parts (including stats-bearing ones) are received.
      - Identify that `summarizeStats(stats)` runs before `Close` drains
        the stream — `defer res.Close` does not run until the function
        returns, so the helper may consume empty/partial stats.
      - Recommend the fix: call `res.Close(ctx)` synchronously (and check
        its error) before reading/returning data derived from `stats`.

      Full fail if the response:
      - Treats `defer Close` as sufficient while billing happens before return.
      - Blames only retry/idempotency without mentioning stream drain / stats timing.
      - Says the pattern is fine because `Query` returned nil error.
  - type: contains
    metric: exact-rule-id
    value: RULE-GO-11
