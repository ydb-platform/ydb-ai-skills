description: C++ audit · caller stop and deadline omitted from retries (RULE-CPP-12)

vars:
  user_prompt: |
    Review this C++ request path. `requestStop` is requested when the upstream
    caller disconnects, `callerDeadline` is its absolute deadline, and
    `remainingBudget` is the time left until that deadline.

    ```cpp
    NYdb::NQuery::TExecuteQueryResult loadUser(
            NYdb::NQuery::TQueryClient& client,
            std::stop_token requestStop,
            TDeadline callerDeadline,
            TDuration remainingBudget) {
        auto settings = NYdb::NQuery::TExecuteQuerySettings()
            .ClientTimeout(TDuration::Seconds(30))
            .RetrySettings(NYdb::NRetry::TRetryOperationSettings()
                .MaxTimeout(TDuration::Seconds(30))
                .Idempotent(true));

        auto params = NYdb::TParamsBuilder()
            .AddParam("$id").Uint64(42).Build()
            .Build();

        return client.ExecuteQuery(
            "SELECT name FROM users WHERE id = $id",
            NYdb::NQuery::TTxControl::NoTx(),
            params,
            settings).GetValueSync();
    }
    ```

assert:
  - type: llm-rubric
    metric: table-cpp-audit
    threshold: 0.8
    value: |
      The response should:
      - Use the C++ audit format and cite `RULE-CPP-12` in sentence 1.
      - Identify both missing propagation paths: the retry settings omit
        `.CancellationToken(requestStop)`, while request settings omit
        `.Deadline(callerDeadline)` and fixed 30-second `ClientTimeout` /
        `MaxTimeout` ignore `remainingBudget`.
      - Explain that `MaxTimeout` is the shared retry budget and
        `ClientTimeout` bounds the RPC; neither should exceed the caller's
        remaining budget.
      - Recommend `TRetryOperationSettings().CancellationToken(requestStop)`
        plus `.Deadline(callerDeadline)` and caller-derived `MaxTimeout` and
        `ClientTimeout` values.
      - Preserve the exact SDK contract: the stop token stops retry
        orchestration but does not cancel an already running RPC;
        `CLIENT_CANCELLED` may replace a successful result and does not imply
        rollback.

      Full fail if the response claims `CancellationToken` aborts an in-flight
      RPC or proves that the operation had no effect.
  - type: contains
    metric: exact-rule-id
    value: RULE-CPP-12
