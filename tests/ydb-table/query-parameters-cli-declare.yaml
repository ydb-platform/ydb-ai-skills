description: Query parameters · DECLARE remains required by YDB CLI

vars:
  user_prompt: |
    Our cluster runs YDB 25.1.2.7. Why does this command fail with
    `Query does not contain parameter`?

    ```bash
    ydb sql -s 'SELECT value FROM items WHERE id = $id' \
      --param '$id=42'
    ```

    I thought parameter types were inferred now. Show the corrected command.

assert:
  - type: llm-rubric
    metric: table-query
    threshold: 0.8
    value: |
      The response should:
      - Distinguish request-provided types for typed SDK requests using
        Syntax V1 on YDB 25.1.2.7+ from the YDB CLI parameter-input contract.
      - Explain that `ydb sql --param` still requires every accepted
        parameter to be declared in the YQL text; otherwise the CLI reports
        `Query does not contain parameter`.
      - Correct the query by adding exactly `DECLARE $id AS Uint64;` before
        the `SELECT`. The type must not be quoted.
      - Keep `--param '$id=42'` (or an equivalent CLI parameter source);
        `DECLARE` describes the type but does not provide the value.

      Full fail if the response recommends omitting `DECLARE` from this CLI
      command because the server is 25.1.2.7+, quotes `"Uint64"`, or interpolates
      `42` into the query text as the fix.
