# Ground truth: ydb-platform/ydb@c239d93fcba3bd382da097b24869dd2322aaabf6
# - yql/essentials/sql/v1/translation/sql_translation.cpp:1981-2012
# - ydb/core/kqp/ut/scheme/kqp_constraints_ut.cpp:96-173,200-295
# - ydb/core/kqp/ut/scheme/kqp_scheme_ut.cpp:15775-15807
description: Query · Use SERIAL correctly in YDB 25.1+

vars:
  user_prompt: |
    I'm porting this PostgreSQL table to YDB 25.1 or newer and expect well
    over 2 billion rows:

    ```sql
    CREATE TABLE orders (
        id SERIAL PRIMARY KEY,
        customer_id BIGINT NOT NULL
    );
    ```

    Show the correct YDB `CREATE TABLE` and an `INSERT` that lets YDB
    generate the identifier. Also say whether I can add the generated-id
    column later with `ALTER TABLE`.

assert:
  - type: regex
    value: \bid\s+BigSerial\b
  - type: regex
    value: \bcustomer_id\s+Int64\b
  - type: regex
    value: PRIMARY\s+KEY\s*\(\s*id\s*\)
  - type: regex
    value: INSERT\s+INTO\s+orders\s*\(\s*customer_id\s*\)
  - type: regex
    value: ALTER\s+TABLE[\s\S]*ADD\s+COLUMN[\s\S]*Serial
  - type: llm-rubric
    value: |
      The response should:
      - State that YDB 25.1+ supports serial column types directly. Do not
        claim that identifiers must be generated by the client.
      - Use `id BigSerial` in the YDB table because `Serial` / `Serial4` maps
        to `Int32`, while `BigSerial` / `Serial8` maps to `Int64`. It may also
        mention `SmallSerial` / `Serial2` mapping to `Int16`.
      - Produce valid YDB DDL with a separate `PRIMARY KEY (id)` clause and
        YDB type `Int64` for `customer_id`, for example:
        `CREATE TABLE orders (id BigSerial, customer_id Int64 NOT NULL,
        PRIMARY KEY (id));`.
      - Show an `INSERT` that omits `id`, allowing YDB's backing
        sequence to generate it, for example
        `INSERT INTO orders (customer_id) VALUES (42);`.
      - State that adding a serial column later with
        `ALTER TABLE ... ADD COLUMN ... Serial` is unsupported; the serial
        column must be declared when the table is created.

      Full fail if the response says YDB has no `Serial` / `BigSerial`, uses
      PostgreSQL's inline `PRIMARY KEY` syntax unchanged, recommends
      `AUTO_INCREMENT`, or supplies an explicit `id` in the only insert shown.
