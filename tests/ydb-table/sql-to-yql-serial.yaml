description: Query · Converting PostgreSQL SERIAL to YQL

vars:
  user_prompt: |
    I'm porting a PostgreSQL schema to YDB. The original table uses
    `id SERIAL PRIMARY KEY`. What's the YQL equivalent?

assert:
  - type: llm-rubric
    metric: table-sql
    threshold: 0.8
    value: |
      The response should:
      - State that YDB has serial data types and show the direct YQL shape
        `id Serial` with `PRIMARY KEY (id)` (or an equivalent CREATE TABLE).
      - Explain that a serial column generates integer values automatically
        and may be used only as part of the primary key.
      - Warn that a monotonically increasing serial value as the sole primary
        key creates uneven distribution and a hot last partition.
      - For a high-write distributed design, recommend a client-generated UUID
        or a hash-prefix plus externally generated id instead of the serial PK.
      - Not invent an `AUTO_INCREMENT` keyword or a user-created
        `CREATE SEQUENCE`; YDB's sequence behind a serial column is private.

      Full fail if the response claims that YDB has no `Serial` type, suggests
      `AUTO_INCREMENT`, or suggests a standalone `CREATE SEQUENCE` in YQL.
